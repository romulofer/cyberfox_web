server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Prerendered static routes; fall back to the SPA 404 page for unknown paths.
	location / {
		try_files $uri $uri.html $uri/ /404.html;
	}

	# Templates persistence API (self-hosted only). The trailing slash strips the
	# /api prefix, so /api/templates reaches the backend as /templates.
	location /api/ {
		proxy_pass http://api:8787/;
		proxy_set_header Host $host;
	}

	# Immutable hashed assets can be cached aggressively.
	location /_app/immutable/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}
}
